services:
  115work:
    image: ghcr.io/zaiwuli/115work:latest
    ports:
      - "${WORK115_PORT:-5656}:5656"
    volumes:
      - ./data:/data
    environment:
      WORK115_ADAPTER: disabled
      WORK115_LOCAL_NO_AUTH: "true"
    init: true
    mem_limit: 1g
    restart: unless-stopped
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
